name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, e.g. v1.1.0
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    env:
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Configure signed update channel
        run: |
          test -n "$SPARKLE_PRIVATE_KEY" || { echo 'Set repository secret SPARKLE_PRIVATE_KEY before releasing.'; exit 1; }
          PUBLIC_KEY=$(printf '%s' "$SPARKLE_PRIVATE_KEY" | swift scripts/release-key.swift)
          python3 scripts/prepare-release.py "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$PUBLIC_KEY"
      - name: Verify
        run: zsh test.sh
      - name: Build universal application
        env:
          MERIDIAN_ARCHS: arm64 x86_64
        run: zsh build.sh
      - name: Package and sign update feed
        run: |
          mkdir -p dist/updates
          VERSION=$(python3 -c 'import json; print(json.load(open("Config/release.json"))["version"])')
          ditto -c -k --sequesterRsrc --keepParent dist/Meridian.app "dist/updates/Meridian-$VERSION-macOS.zip"
          cp CHANGELOG.md "dist/updates/Meridian-$VERSION-macOS.md"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | .build/Sparkle/bin/generate_appcast --ed-key-file - --maximum-deltas 0 --embed-release-notes --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/" dist/updates
      - name: Publish release and appcast together
        run: |
          gh release create "$RELEASE_TAG" dist/updates/*.zip dist/updates/appcast.xml --repo "$GITHUB_REPOSITORY" --title "Meridian $RELEASE_TAG" --notes-file CHANGELOG.md --verify-tag
